<style>
:root{
  --bg:#F7F3EB; --surface:#FFFDF8; --ink:#1F2623; --muted:#6B726D; --line:#DED7C8;
  --accent:#1F5C4A; --accent-ink:#FFFFFF; --plus:#2C7A57; --minus:#B04A36; --soft:#EFE9DC;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141815; --surface:#1B201D; --ink:#ECEAE3; --muted:#9AA29C; --line:#2D342F;
    --accent:#5FBF9A; --accent-ink:#0F1A15; --plus:#6CC59B; --minus:#E58C78; --soft:#222925;
  }
}
:root[data-theme="dark"]{
  --bg:#141815; --surface:#1B201D; --ink:#ECEAE3; --muted:#9AA29C; --line:#2D342F;
  --accent:#5FBF9A; --accent-ink:#0F1A15; --plus:#6CC59B; --minus:#E58C78; --soft:#222925;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:54px 18px 120px}
:root.emb{padding-top:0}
:root.emb #app{padding-top:6px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-0.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.top .r2{display:flex;gap:12px;flex-wrap:nowrap}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:500;font-size:14px;white-space:nowrap}
.brand{font-family:var(--serif);font-weight:700;font-size:19px;white-space:nowrap}
.hero{padding:18px 0 16px;border-bottom:1px solid var(--line)}
.hero .small{color:var(--muted);font-size:14px}
.big{font-family:var(--serif);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-0.01em;margin:4px 0 2px;font-variant-numeric:lining-nums}
.head{font-size:19px;font-weight:600;padding:16px 0 14px;border-bottom:1px solid var(--line);line-height:1.3}

.plus{color:var(--plus)} .minus{color:var(--minus)} .muted{color:var(--muted)}
.hero h1{font-size:24px}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:15px 0}
.item .t{font-weight:600;font-size:16px}
.item .s{color:var(--muted);font-size:14px;margin-top:1px}
.item .r{text-align:right;font-size:14px;white-space:nowrap}

.grp{align-items:flex-start}

.left{display:flex;align-items:center;gap:12px;min-width:0}

.tab{background:none;border:0;padding:14px 0 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}

.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:flex-end;padding:12px max(18px,calc((100vw - 560px)/2 + 18px)) calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}

.scrim.on{display:block}

.fld{display:flex;align-items:flex-end;gap:12px;margin:0 0 16px}

.fld input.amt{font-family:var(--serif);font-weight:600;font-size:34px;padding:4px 2px}
.pill{display:block;width:100%;margin:22px 0 6px;padding:12px 14px;border:1px solid var(--ink);border-radius:12px;background:transparent;text-align:center;font-size:15px}

.dline input{width:auto;margin:0;padding:8px 10px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
input,select,textarea{display:block;width:100%;margin-top:5px;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.person label{display:flex;align-items:center;gap:10px;margin:0;flex:1;color:var(--ink);font-size:16px}
.person input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.person .in{width:96px;margin:0;padding:8px 10px;text-align:right}
.person .sh{font-size:14px;color:var(--muted);min-width:70px;text-align:right}
.hint{min-height:22px;margin:8px 0 0;font-size:14px;color:var(--muted);text-align:center}
.hint.bad{color:var(--minus)}
.acts{display:flex;gap:10px;margin-top:8px}
.acts .btn{flex:1}
.mem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mem span.n{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.chips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--muted)}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.mrow{display:grid;grid-template-columns:38px 1fr 96px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow .ml{font-size:14px;color:var(--muted)}
.mrow .mv{text-align:right;font-size:14px;font-family:var(--serif)}
.track.stk{display:flex}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 2px}
.avs{display:flex;flex:none;min-width:68px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;border:2px solid var(--surface)}
.av+.av{margin-left:-12px}
.av.pay{box-shadow:0 0 0 2px var(--accent)}
.opt .tx{flex:1;font-size:16px;line-height:1.35}
.opt .tx span{display:block;font-size:14px}
.opt .ck{color:var(--accent);font-size:20px}
.band{background:var(--soft);margin:0 -20px 4px;padding:14px 20px;text-align:center;font-size:15px}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px 9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.back span{font-size:22px;line-height:1;margin-top:-2px;color:var(--accent)}
.back:active{background:var(--soft)}
.bar[hidden]{display:none}
.sbox{margin:14px 0 4px;border-radius:999px;padding:11px 16px}
.mast{padding:2px 0 18px;border-bottom:1px solid var(--line)}
.mast h1{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-0.02em;margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 14px}
.mast h1 span{font-family:var(--sans);font-size:16px;font-weight:700;letter-spacing:0;color:var(--muted)}
.mast p{margin:10px 0 0;color:var(--muted);font-size:17px;line-height:1.35}
.links{display:flex;gap:22px;padding:6px 0 0;flex-wrap:wrap}
.links .link{font-size:15px}
.foot{display:flex;justify-content:center;gap:28px;margin-top:28px;flex-wrap:wrap}
.foot .link{font-size:15px}
.foot+.sync{margin-top:8px}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 16px;padding:11px;border:1px dashed var(--accent);border-radius:12px;background:transparent;color:var(--accent);font-weight:600}
.sit{padding:8px 0;border-bottom:1px solid var(--line)}
.sit1{display:grid;grid-template-columns:1fr 88px 36px;gap:8px;align-items:center}
.sit input,.sit select{margin:0;padding:9px 10px;font-size:15px}
.sit select{margin-top:6px;width:auto;padding:6px 10px;font-size:14px;color:var(--muted)}
.sit .x{background:none;border:0;color:var(--muted);font-size:18px;padding:6px}
[hidden],input[type=file]{display:none !important}
.brow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.brow .bmain{flex:1;min-width:0}
.brow input,.brow select{margin:6px 0 0;padding:9px 10px;font-size:15px}
.brow input[type=checkbox]{width:22px;height:22px;margin:12px 0 0;padding:0;accent-color:var(--accent);flex:none}
.brow .row2{gap:8px}
.brow .sm{margin-top:6px}
</style>

<script>
(function(){
'use strict';
var KEY='halbe-halbe:v2', PKEY='halbe-halbe:prefs';
var COLORS=['#1F5C4A','#8E2640','#C0432A','#3FA58A','#5B4B8A','#B07A1F'];
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
var eur=function(c){return fmt.format(Math.abs(c)/100)};
function today(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function parseAmt(s){var n=parseFloat(String(s||'').replace(/\s/g,'').replace(',','.'));return isFinite(n)&&n>0?Math.round(n*100):0}
function parseNum(s){var n=parseFloat(String(s||'').replace(',','.'));return isFinite(n)?n:0}
function toStr(c){return (c/100).toFixed(2).replace('.',',')}

/* Zustand */
var state={groups:[]}, prefs={}, cloud=null, ready=false;
var ui={view:'home',gid:null,tab:'ausgaben',showSettled:false};
var sheet=null, form=null, confirmDel=false;

/* Speicher: Firebase (gemeinsam) oder lokal als Rückfall */
var COL='household', DOCID='halbehalbe', seedChecked=false, backedUp=false, backupList=null, confirmRestore=null;
function loadPrefsLocal(){try{prefs=JSON.parse(localStorage.getItem(PKEY)||'{}')||{}}catch(e){prefs={}}}
function savePrefs(){try{localStorage.setItem(PKEY,JSON.stringify(prefs))}catch(e){}}
function saveLocal(){
  if(cloud)return;
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
}
function werr(){toast('Das konnte nicht gespeichert werden. Bitte Verbindung prüfen.')}
function cfgOk(){
  var c=window.HH_FIREBASE_CONFIG;
  return !!(c&&c.apiKey&&c.projectId&&String(c.apiKey).indexOf('HIER')<0&&String(c.projectId).indexOf('HIER')<0);
}
function dref(){return cloud.collection(COL).doc(DOCID)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function groupMeta(g){
  return {name:g.name,color:g.color||'',special:!!g.special,order:g.order||0,members:g.members.map(function(m){return {id:m.id,name:m.name}})};
}
function groupFull(g){var d=groupMeta(g);d.id=g.id;d.expenses=clone(g.expenses||[]);return d}
function editGroups(fn){
  var ref=dref();
  cloud.runTransaction(function(tx){
    return tx.get(ref).then(function(s){
      var gs=(s.exists&&s.data().value&&s.data().value.groups)||[];
      gs=clone(gs);
      var out=fn(gs)||gs;
      tx.set(ref,{value:{groups:out},updatedAt:Date.now()});
    });
  }).catch(werr);
}
function findG(gs,id){return gs.find(function(x){return x.id===id})}
function persistGroup(g){
  if(state.groups.indexOf(g)<0)state.groups.push(g);
  if(!cloud){saveLocal();return}
  editGroups(function(gs){
    var t=findG(gs,g.id);
    if(!t){t={id:g.id,expenses:[]};gs.push(t)}
    var m=groupMeta(g);for(var k in m)t[k]=m[k];
    return gs;
  });
}
function writeGroupFull(g){
  if(state.groups.indexOf(g)<0)state.groups.push(g);
  if(!cloud){saveLocal();return}
  editGroups(function(gs){
    var i=gs.findIndex(function(x){return x.id===g.id}),f=groupFull(g);
    if(i>=0)gs[i]=f;else gs.push(f);
    return gs;
  });
}
function putExpense(g,rec){
  var list=g.expenses.slice(),i=list.findIndex(function(x){return x.id===rec.id});
  if(i>=0)list[i]=rec;else list.push(rec);
  g.expenses=list;
  if(!cloud){saveLocal();return}
  editGroups(function(gs){
    var t=findG(gs,g.id);if(!t)return gs;
    var arr=t.expenses||[],j=arr.findIndex(function(x){return x.id===rec.id});
    if(j>=0)arr[j]=clone(rec);else arr.push(clone(rec));
    t.expenses=arr;return gs;
  });
}
function removeExpense(g,id){
  g.expenses=g.expenses.filter(function(x){return x.id!==id});
  if(!cloud){saveLocal();return}
  editGroups(function(gs){var t=findG(gs,g.id);if(t)t.expenses=(t.expenses||[]).filter(function(x){return x.id!==id});return gs});
}
function removeGroup(g){
  state.groups=state.groups.filter(function(x){return x!==g});
  if(!cloud){saveLocal();return}
  editGroups(function(gs){return gs.filter(function(x){return x.id!==g.id})});
}
function idxRef(){return cloud.collection(COL).doc('halbehalbe-backups')}
function bdoc(date){return cloud.collection(COL).doc('halbehalbe-backup-'+date)}
function dayLabel(date){return new Date(date+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}
function autoBackup(){
  if(!cloud||backedUp||!state.groups.length)return;
  backedUp=true;
  var day=today(),snapshot=state.groups.map(groupFull),ts=Date.now();
  cloud.runTransaction(function(tx){
    var ref=idxRef();
    return tx.get(ref).then(function(s){
      var items=(s.exists&&s.data().value&&s.data().value.items)||[];
      if(items.some(function(i){return i.date===day}))return null;
      var all=clone(items).concat([{date:day,ts:ts}]).sort(function(a,b){return a.date<b.date?1:-1});
      var keep=all.slice(0,7),drop=all.slice(7);
      tx.set(ref,{value:{items:keep},updatedAt:Date.now()});
      return {drop:drop};
    });
  }).then(function(r){

/* Rechnen */
function balances(g){
  var b={};g.members.forEach(function(m){b[m.id]=0});
  g.expenses.forEach(function(e){
    b[e.payer]=(b[e.payer]||0)+e.amount;
    for(var k in e.splits){b[k]=(b[k]||0)-e.splits[k]}
  });
  return b;
}
function settleList(b){
  var cr=[],de=[],k;
  for(k in b){if(b[k]>0)cr.push([k,b[k]]);else if(b[k]<0)de.push([k,-b[k]])}
  cr.sort(function(a,c){return c[1]-a[1]});de.sort(function(a,c){return c[1]-a[1]});
  var out=[],i=0,j=0;
  while(i<cr.length&&j<de.length){
    var x=Math.min(cr[i][1],de[j][1]);
    out.push({from:de[j][0],to:cr[i][0],amt:x});
    cr[i][1]-=x;de[j][1]-=x;
    if(cr[i][1]===0)i++;
    if(de[j][1]===0)j++;
  }
  return out;
}
function distribute(total,weights){
  var ids=Object.keys(weights);
  var sum=ids.reduce(function(a,k){return a+weights[k]},0);
  if(!ids.length||sum<=0||total<=0)return null;
  var out={},used=0;
  ids.forEach(function(k){out[k]=Math.floor(total*weights[k]/sum);used+=out[k]});
  var rest=total-used;
  var order=ids.map(function(k){return [k,total*weights[k]/sum-out[k]]}).sort(function(a,b){return b[1]-a[1]});
  for(var i=0;rest>0;i=(i+1)%order.length){out[order[i][0]]++;rest--}
  return out;
}
function calcSplit(g,f){
  var total=parseAmt(f.amount);
  var ids=g.members.filter(function(m){return f.sel[m.id]}).map(function(m){return m.id});
  if(!ids.length)return {ok:false,hint:'Wähle mindestens eine Person.',bad:true};
  var w={},sum=0,i;
  if(f.mode==='equal'){
    ids.forEach(function(k){w[k]=1});
    var s=distribute(total,w);
    return {ok:!!s,splits:s,hint:s?'Je Person etwa '+eur(Math.round(total/ids.length)):''};
  }
  if(f.mode==='shares'){
    for(i=0;i<ids.length;i++){var v=f.raw[ids[i]]===undefined||f.raw[ids[i]]===''?1:parseNum(f.raw[ids[i]]);if(v<=0)return {ok:false,hint:'Anteile müssen größer als 0 sein.',bad:true};w[ids[i]]=v}
    var s2=distribute(total,w);
    return {ok:!!s2,splits:s2,hint:''};
  }
  if(f.mode==='percent'){
    ids.forEach(function(k){var v=parseNum(f.raw[k]);w[k]=v>0?v:0;sum+=w[k]});
    var okp=Math.abs(sum-100)<0.01;
    var sp=okp?distribute(total,w):null;
    return {ok:okp&&!!sp,splits:sp,hint:'Summe '+String(Math.round(sum*100)/100).replace('.',',')+' von 100 Prozent',bad:!okp};
  }
  var sp2={},tot=0;
  ids.forEach(function(k){var c=parseAmt(f.raw[k]);if(c>0){sp2[k]=c;tot+=c}});
  var diff=total-tot;
  if(total<=0)return {ok:false,hint:'',splits:null};
  return {ok:diff===0&&tot>0,splits:diff===0?sp2:null,hint:diff===0?'Passt genau.':(diff>0?'Noch offen: ':'Zu viel verteilt: ')+eur(diff),bad:diff!==0};
}

function G(){return state.groups.find(function(g){return g.id===ui.gid})}
function nm(g,id){var m=g.members.find(function(m){return m.id===id});return m?m.name:'Unbekannt'}
function meId(g){
  if(!prefs.meName)return null;

function myBal(g){var me=meId(g);return me?(balances(g)[me]||0):0}
function balText(c){return c>0?'Du bekommst':(c<0?'Du schuldest':'Ausgeglichen')}
function balCls(c){return c>0?'plus':(c<0?'minus':'muted')}
function toast(t,ms){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},ms||2600)}
function lastAct(g){var m=0;g.expenses.forEach(function(e){var t=e.ts||new Date(e.date+'T12:00:00').getTime();if(t>m)m=t});return m}
function lastTouch(g){var m=0;g.expenses.forEach(function(e){var t=Math.max(e.mts||0,e.ts||0)||new Date(e.date+'T12:00:00').getTime();if(t>m)m=t});return m}

function isSettled(g){if(!g.expenses.length)return false;var b=balances(g);return Object.keys(b).every(function(k){return b[k]===0})}
function isHidden(g){return !g.special&&isSettled(g)&&Date.now()-lastAct(g)>7*864e5}

  return out.join('<br>');
}

var st={year:new Date().getFullYear(),filter:'all'};
function colorOf(name,all){var i=all.indexOf(name);return COLORS[(i<0?0:i)%COLORS.length]}
function statData(){
  var years={},cur=String(new Date().getFullYear());years[cur]=1;
  var all=[];
  state.groups.forEach(function(g){
    g.members.forEach(function(m){if(all.indexOf(m.name)<0)all.push(m.name)});
    g.expenses.forEach(function(e){if(e.type==='expense'&&e.date)years[e.date.slice(0,4)]=1});
  });
  all.sort();
  var ylist=Object.keys(years).sort(function(a,b){return b-a});
  if(!years[String(st.year)])st.year=+ylist[0];
  if(st.filter!=='all'&&!state.groups.some(function(g){return g.id===st.filter}))st.filter='all';
  var paid={},share={},total=0,months=[],byGroup=[],i;
  for(i=0;i<12;i++)months.push({total:0,per:{}});
  state.groups.forEach(function(g){
    if(st.filter!=='all'&&g.id!==st.filter)return;
    var gt=0;
    g.expenses.forEach(function(e){
      if(e.type!=='expense'||String(e.date||'').slice(0,4)!==String(st.year))return;
      var pn=nm(g,e.payer);
      paid[pn]=(paid[pn]||0)+e.amount;total+=e.amount;gt+=e.amount;
      for(var k in e.splits){var sn=nm(g,k);share[sn]=(share[sn]||0)+e.splits[k]}
      var mi=parseInt(e.date.slice(5,7),10)-1;
      if(mi>=0&&mi<12){months[mi].total+=e.amount;months[mi].per[pn]=(months[mi].per[pn]||0)+e.amount}
    });
    if(gt)byGroup.push({g:g,total:gt});
  });
  var names=Object.keys(paid);
  Object.keys(share).forEach(function(n){if(names.indexOf(n)<0)names.push(n)});
  names.sort(function(a,b){return (paid[b]||0)-(paid[a]||0)});
  return {ylist:ylist,all:all,paid:paid,share:share,total:total,months:months,names:names,byGroup:byGroup};
}

function matchE(g,e,withGroup){

var scanTok=0;
function parseSigned(s){var n=parseFloat(String(s||'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?Math.round(n*100):0}
function readImage(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb(new Error('Datei nicht lesbar'))};
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var max=1600,sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        cb(null,c.toDataURL('image/jpeg',0.82));
      }catch(e){cb(null,fr.result)}
    };
    img.onerror=function(){cb(new Error('Bild nicht lesbar'))};
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function postScan(dataUrl){
  return fetch(window.HH_SCAN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:String(dataUrl).split(',')[1],mediaType:'image/jpeg'})}).then(function(r){

      if(!r.ok){var e=new Error('http '+r.status);e.detail=(j&&(j.detail||j.error))||('Status '+r.status);throw e}
      return j;
    });

function toDocs(d,payer){
  var list=(d&&Array.isArray(d.belege)&&d.belege.length)?d.belege:[d||{}],out=[];
  list.forEach(function(x){
    var items=(Array.isArray(x.positionen)?x.positionen:[]).filter(function(i){return i&&i.name!=null}).map(function(i){return {name:String(i.name),price:toStr(Math.round((+i.preis||0)*100)),who:'all'}});
    var sumC=items.reduce(function(a,i){return a+parseSigned(i.price)},0);
    var gAbs=Math.abs(+x.gesamt||0),tot=gAbs>0?Math.round(gAbs*100):sumC;
    if(!x.haendler&&!tot&&!items.length)return;
    out.push({on:true,totalTouched:items.length>0&&tot!==sumC,desc:String(x.haendler||''),date:/^\d{4}-\d{2}-\d{2}$/.test(x.datum||'')?x.datum:today(),total:tot>0?toStr(tot):'',payer:payer,items:items});
  });
  return out;
}
function scanOne(file){
  var p=(window.HH_SCAN_URL==='demo')?demoScan():new Promise(function(res,rej){readImage(file,function(err,url){if(err)rej(err);else res(url)})}).then(postScan);
  return p.then(function(d){return toDocs(d,form?form.payer:null)});
}

  var p=form&&form.scanProg;
  return p&&p.n>1?'Beleg '+p.i+' von '+p.n+' wird gelesen …':'Der Beleg wird gelesen …';
}

function runScanFiles(files){
  var tok=++scanTok,docs=[],failed=0,lastWhy='',n=files.length,i=0;
  form.page='scanning';form.scanProg={i:1,n:n};renderSheet();
  function finish(){
    if(tok!==scanTok||!form)return;
    form.scanProg=null;
    if(!docs.length){
      form.page=null;renderSheet();
      toast('Beleg lesen fehlgeschlagen'+(lastWhy?': '+lastWhy:'')+'. Versuche ein schärferes Foto.',7000);
      return;
    }
    if(docs.length===1){form.scan=docs[0];form.page='scanned'}
    else{form.batch={docs:docs};form.page='batch'}
    renderSheet();
    if(failed)toast(failed+(failed===1?' Foto konnte':' Fotos konnten')+' nicht gelesen werden',5000);
  }
  function next(){
    if(tok!==scanTok||!form)return;
    if(i>=n){finish();return}
    form.scanProg={i:i+1,n:n};updateProg();
    var f=files[i++];
    scanOne(f).then(function(ds){
      docs=docs.concat(ds);
      if(!ds.length){failed++;lastWhy='nichts erkannt'}
      next();
    }).catch(function(e){
      failed++;lastWhy=String((e&&(e.detail||e.message))||'').replace(/\s+/g,' ').slice(0,140);
      next();
    });
  }
  next();
}
function scanBuild(g,sc){
  var c=scanCalc(g,sc),T=c.total;
  if(T<=0)return null;
  var sel={},raw={},mode='equal',splits=null,w={};
  c.ids.forEach(function(k){w[k]=1});
  if(c.allEq||!sc.items.length){splits=distribute(T,w);c.ids.forEach(function(k){sel[k]=true})}
  else{
    var w2={};c.ids.forEach(function(k){w2[k]=Math.max(0,c.per[k])});
    var sp=distribute(T,w2);
    if(!sp){splits=distribute(T,w);c.ids.forEach(function(k){sel[k]=true})}
    else{mode='exact';splits=sp;c.ids.forEach(function(k){if(sp[k]>0){sel[k]=true;raw[k]=toStr(sp[k])}})}
  }
  if(!splits)return null;
  return {desc:(sc.desc||'').trim()||'Einkauf',amount:T,date:sc.date||today(),payer:sc.payer||g.members[0].id,mode:mode,splits:splits,raw:raw,sel:sel};
}

function spread(c,ids){
  var w={};ids.forEach(function(k){w[k]=1});
  var d=distribute(Math.abs(c),w)||{};
  ids.forEach(function(k){d[k]=(d[k]||0)*(c<0?-1:1)});
  return d;
}
function scanCalc(g,sc){
  var ids=g.members.map(function(m){return m.id}),per={},sum=0,allEq=true;
  ids.forEach(function(k){per[k]=0});
  sc.items.forEach(function(i){
    var c=parseSigned(i.price);sum+=c;
    if(i.who==='all'||!per.hasOwnProperty(i.who)){var d=spread(c,ids);ids.forEach(function(k){per[k]+=d[k]})}
    else{per[i.who]+=c;allEq=false}
  });
  var tot=parseAmt(sc.total)||sum;
  return {ids:ids,per:per,sum:sum,total:tot,allEq:allEq};
}

  h+='<div style="font-size:14px;color:var(--muted);margin-top:4px">Positionen. Wähle bei jeder, für wen sie ist.</div>';
  sc.items.forEach(function(it,i){
    var who='<option value="all"'+(it.who==='all'?' selected':'')+'>Für alle</option>'+g.members.map(function(m){return '<option value="'+esc(m.id)+'"'+(it.who===m.id?' selected':'')+'>Nur '+esc(m.name)+'</option>'}).join('');
    h+='<div class="sit"><div class="sit1"><input data-si="'+i+'" data-sk="name" value="'+esc(it.name)+'" autocomplete="off" aria-label="Bezeichnung"><input data-si="'+i+'" data-sk="price" inputmode="decimal" value="'+esc(it.price)+'" autocomplete="off" aria-label="Preis"><button class="x" data-a="scanDel" data-i="'+i+'" aria-label="Position entfernen">✕</button></div><select data-si="'+i+'" data-sk="who" aria-label="Für wen">'+who+'</select></div>';
  });
  h+='<div style="margin-top:8px"><button class="link" data-a="scanAdd">Position hinzufügen</button></div><div class="hint" id="scansum" style="text-align:left"></div>';
  return h;
}
function groupSheet(){
  return '<div class="grab"></div><h2>Neue Gruppe</h2><label>Name der Gruppe<input id="gname" placeholder="Zum Beispiel Urlaub Italien" autocomplete="off"></label><label>Mitglieder, durch Komma getrennt. Du wirst automatisch ergänzt.<textarea id="gmem" placeholder="Anna, Ben"></textarea></label><div class="acts"><button class="btn ghost" data-a="close">Abbrechen</button><button class="btn" data-a="saveGroup">Gruppe anlegen</button></div>';
}
function membersSheet(g){
  var used={};g.expenses.forEach(function(e){used[e.payer]=1;for(var k in e.splits)used[k]=1});
  var me=meId(g);
  var h='<div class="grab"></div><h2>Gruppe verwalten</h2><label>Name der Gruppe<input id="rename" value="'+esc(g.name)+'" autocomplete="off"></label><div style="font-size:14px;color:var(--muted)">Mitglieder</div>';
  g.members.forEach(function(m){
    h+='<div class="mem"><span class="n">'+esc(m.name)+(m.id===me?' (du)':'')+'</span>'+(used[m.id]?'<span class="muted" style="font-size:13px">hat Ausgaben</span>':'<button class="link" data-a="delMember" data-id="'+esc(m.id)+'">Entfernen</button>')+'</div>';
  });
  h+='<div class="row2" style="margin-top:14px;align-items:end"><label style="margin:0">Neues Mitglied<input id="newm" placeholder="Name" autocomplete="off"></label><button class="btn ghost" data-a="addMember">Hinzufügen</button></div>';
  h+='<div class="acts" style="margin-top:22px">'+(g.special?'':'<button class="btn danger" data-a="delGroup">'+(confirmDel?'Wirklich löschen':'Gruppe löschen')+'</button>')+'<button class="btn" data-a="saveMembers">Fertig</button></div>';
  return h;
}
function whoSheet(){
  var names=[];state.groups.forEach(function(g){g.members.forEach(function(m){if(names.indexOf(m.name)<0)names.push(m.name)})});
  var h='<div class="grab"></div><h2>Wer bist du?</h2><p class="muted" style="margin-top:0;font-size:14px">Damit die App weiß, was du bekommst oder schuldest. Das merkt sich dein Gerät.</p>';
  names.forEach(function(n){h+='<button class="item" data-a="setWho" data-n="'+esc(n)+'"><span class="t">'+esc(n)+'</span>'+(n===prefs.meName?'<span class="r plus">gewählt</span>':'')+'</button>'});
  return h;
}
function backupSheet(){
  var json=JSON.stringify(state);
  return '<div class="grab"></div><h2>Sicherung</h2>'+autoBackupHtml()+'<p class="muted" style="margin-top:0;font-size:14px">Kopiere den Text unten als Sicherung. Mit "Daten laden" spielst du eine Sicherung wieder ein.</p><label>Daten<textarea id="bdata" spellcheck="false">'+esc(json)+'</textarea></label><div class="acts"><button class="btn ghost" data-a="copyBackup">Kopieren</button><button class="btn" data-a="loadBackup">Daten laden</button></div><div class="acts"><button class="btn ghost" data-a="restoreSeed">'+(confirmDel?'Wirklich eintragen':'Startdaten neu eintragen')+'</button></div><div class="acts"><button class="btn ghost" data-a="close">Schließen</button></div>';
}
function renderSheet(){
  var p=$('#panel'),s=$('#scrim');
  if(!sheet){p.classList.remove('on');s.classList.remove('on');p.innerHTML='';return}
  var g=G(),top=p.scrollTop,h='';
  if(sheet==='expense'&&g)h=expenseSheet(g);
  else if(sheet==='group')h=groupSheet();
  else if(sheet==='members'&&g)h=membersSheet(g);
  else if(sheet==='backup')h=backupSheet();
  else if(sheet==='pickgroup')h=pickGroupSheet();
  else if(sheet==='who')h=whoSheet();
  p.innerHTML=h;p.classList.add('on');s.classList.add('on');p.scrollTop=top;
  if(sheet==='expense'){updateHint();if(form&&form.page==='scanned')updateScan();if(form&&form.page==='batch')updateBatch()}
}
function renderApp(){
  $('#app').innerHTML=ui.view==='search'?searchView():(ui.view==='stat'?statView():(ui.view==='home'?homeView():groupView()));
  $('#bar').hidden=!(ready&&!sheet&&state.groups.length>0&&((ui.view==='group'&&G())||ui.view==='home'));
  if(ready&&!prefs.meName&&state.groups.length&&!sheet){sheet='who';renderSheet()}
}
function render(){renderApp();renderSheet()}
function updateHint(){
  var g=G();if(!g||!form)return;
  var total=parseAmt(form.amount),ok,hint=$('#hint');
  if(!hint)return;
  if(form.type==='payment'){
    ok=total>0&&form.payer!==form.to;
    hint.textContent=form.payer===form.to?'Zahler und Empfänger müssen verschieden sein.':'';
    hint.className='hint'+(form.payer===form.to?' bad':'');
  }else{
    var c=calcSplit(g,form);
    ok=!!c.ok&&total>0&&form.desc.trim().length>0;
    hint.textContent=form.open||c.bad?(c.hint||''):'';
    hint.className='hint'+(c.bad?' bad':'');
    g.members.forEach(function(m){
      var el=document.getElementById('sh'+m.id);
      if(el)el.textContent=c.splits&&c.splits[m.id]!=null?eur(c.splits[m.id]):'';
    });
    var pl=$('#pill');if(pl)pl.textContent=pillText(g,form);
  }
  var b=$('#save');if(b)b.disabled=!ok;
}

/* Aktionen */
function newForm(g,type,pre){
  var sel={};g.members.forEach(function(m){sel[m.id]=true});
  var f={id:null,type:type,desc:'',amount:'',payer:meId(g)||g.members[0].id,to:'',date:today(),mode:'equal',sel:sel,raw:{},open:false};
  for(var k in (pre||{}))f[k]=pre[k];
  return f;
}
var A={
  stat:function(d){st.filter=d.id||'all';ui.from=ui.view;ui.view='stat';render();window.scrollTo(0,0)},
  statBack:function(){ui.view=ui.from||'home';render();window.scrollTo(0,0)},
  syear:function(d){st.year=+d.y;render()},
  sfilter:function(d){st.filter=d.id;render()},
  home:function(){q.text='';ui={view:'home',gid:null,tab:'ausgaben',showSettled:ui.showSettled};render()},
  search:function(){q.text='';ui.view='search';render();var i=$('#sq');if(i)i.focus();window.scrollTo(0,0)},
  searchBack:function(){q.text='';ui.view='home';render();window.scrollTo(0,0)},
  searchOpen:function(d){q.text='';ui.view='group';ui.gid=d.g;ui.tab='ausgaben';A.edit({id:d.id})},
  open:function(d){q.text='';ui.view='group';ui.gid=d.id;ui.tab='ausgaben';render();window.scrollTo(0,0)},
  tab:function(d){ui.tab=d.t;render()},
  toggleSettled:function(){ui.showSettled=!ui.showSettled;render()},
  who:function(){sheet='who';render()},
  setWho:function(d){prefs.meName=d.n;savePrefs();sheet=null;render()},
  newGroup:function(){sheet='group';confirmDel=false;render()},
  close:function(){sheet=null;form=null;confirmDel=false;confirmRestore=null;render()},
  backup:function(){sheet='backup';confirmDel=false;confirmRestore=null;render();loadBackupList()},
  restoreBackup:function(d){
    if(confirmRestore!==d.d){confirmRestore=d.d;renderSheet();return}
    confirmRestore=null;
    bdoc(d.d).get().then(function(s){
      var gs=s.exists&&s.data().value&&s.data().value.groups;
      if(!gs){toast('Diese Sicherung wurde nicht gefunden');return}
      return dref().set({value:{groups:gs},updatedAt:Date.now()}).then(function(){sheet=null;render();toast('Sicherung vom '+dayLabel(d.d)+' zurückgespielt')});
    }).catch(werr);
  },
  restoreSeed:function(){
    if(!confirmDel){confirmDel=true;renderSheet();return}
    seedLocal().groups.forEach(function(sg){
      var g=state.groups.find(function(x){return x.id===sg.id});
      if(!g){writeGroupFull(sg);return}
      if(sg.expenses.length&&!g.expenses.some(function(e){return e.id==='e_start'}))putExpense(g,sg.expenses[0]);
    });
    sheet=null;confirmDel=false;render();toast('Startdaten eingetragen');
  },
  copyBackup:function(){
    var t=$('#bdata');t.select();
    try{navigator.clipboard.writeText(t.value).then(function(){toast('Kopiert')},function(){document.execCommand('copy');toast('Kopiert')})}
    catch(e){try{document.execCommand('copy');toast('Kopiert')}catch(x){toast('Text markiert, bitte manuell kopieren')}}
  },
  loadBackup:function(){
    var d;
    try{d=JSON.parse($('#bdata').value);if(!d||!Array.isArray(d.groups))throw new Error('x')}catch(e){toast('Das sind keine gültigen Daten');return}
    d.groups.forEach(function(sg,i){
      var g=state.groups.find(function(y){return y.id===sg.id});
      if(!g){g={id:sg.id,expenses:[]}}
      g.name=sg.name;g.color=sg.color||'';g.special=!!sg.special;g.order=sg.order||(i+1);
      g.members=(sg.members||[]).map(function(m){return {id:m.id,name:m.name}});
      g.expenses=sg.expenses||[];
      writeGroupFull(g);
    });
    ui={view:'home',gid:null,tab:'ausgaben',showSettled:false};sheet=null;render();toast('Daten geladen');
  },
  saveGroup:function(){
    var name=$('#gname').value.trim();
    var names=$('#gmem').value.split(/[,\n]/).map(function(s){return s.trim()}).filter(Boolean);
    if(prefs.meName&&!names.some(function(n){return n.toLowerCase()===prefs.meName.toLowerCase()}))names.unshift(prefs.meName);
    var seen={};names=names.filter(function(n){var k=n.toLowerCase();if(seen[k])return false;seen[k]=1;return true});
    if(!name){toast('Bitte gib einen Namen ein');return}
    if(names.length<2){toast('Mindestens zwei Mitglieder nötig');return}
    if(!prefs.meName){prefs.meName=names[0];savePrefs()}
    var maxO=state.groups.reduce(function(a,g){return Math.max(a,g.order||0)},0);
    var g={id:'g'+uid(),name:name,color:COLORS[state.groups.length%COLORS.length],special:false,order:maxO+1,members:names.map(function(n){return {id:'m'+uid(),name:n}}),expenses:[]};
    persistGroup(g);
    ui={view:'group',gid:g.id,tab:'ausgaben',showSettled:false};sheet=null;render();
  },
  addExpense:function(){
    if(ui.view==='home'||!G()){
      if(!state.groups.length){toast('Lege zuerst eine Gruppe an');return}
      if(state.groups.length>1){sheet='pickgroup';confirmDel=false;render();return}
      ui.gid=state.groups[0].id;
    }
    var g=G();form=newForm(g,'expense');sheet='expense';confirmDel=false;render();
  },
  pickGroup:function(d){ui.gid=d.id;form=newForm(G(),'expense');sheet='expense';confirmDel=false;render()},
  toggleDetails:function(){form.open=!form.open;renderSheet()},
  pay:function(d){var g=G();form=newForm(g,'payment',{payer:d.from,to:d.to,amount:toStr(parseInt(d.amt,10))});sheet='expense';render()},
  edit:function(d){
    var g=G(),e=g.expenses.find(function(x){return x.id===d.id});if(!e)return;
    var sel={};for(var k in e.splits)sel[k]=true;
    var raw=JSON.parse(JSON.stringify(e.raw||{}));
    form={id:e.id,type:e.type,desc:e.desc,amount:toStr(e.amount),payer:e.payer,to:e.type==='payment'?Object.keys(e.splits)[0]:'',date:e.date,mode:e.mode||'equal',sel:sel,raw:raw,open:false,ts:e.ts};
    sheet='expense';confirmDel=false;render();
  },
  scan:function(){
    if(!window.HH_SCAN_URL){toast('Beleg lesen ist hier nicht eingerichtet');return}
    if(window.HH_SCAN_URL==='demo'){runScanFiles([null]);return}
    var fi=$('#scanfile');if(fi){fi.value='';fi.click()}
  },
  scanCancel:function(){
    if(form.fromBatch){form.fromBatch=false;form.scan=null;form.page='batch';renderSheet();return}
    scanTok++;form.page=null;form.scan=null;form.batch=null;renderSheet();
  },
  scanAdd:function(){form.scan.items.push({name:'',price:'',who:'all'});renderSheet()},
  scanDel:function(d){form.scan.items.splice(+d.i,1);syncTotal();renderSheet()},
  scanApply:function(){
    if(form.fromBatch){form.fromBatch=false;form.scan=null;form.page='batch';renderSheet();return}
    var g=G(),b=scanBuild(g,form.scan);
    if(!b){toast('Bitte einen Gesamtbetrag eintragen');return}
    form.desc=b.desc;form.amount=toStr(b.amount);form.date=b.date;form.payer=b.payer;form.mode=b.mode;form.sel=b.sel;form.raw=b.raw;
    form.page=null;form.scan=null;renderSheet();
  },
  batchCancel:function(){scanTok++;form.page=null;form.batch=null;form.scan=null;form.fromBatch=false;renderSheet()},
  batchOpen:function(d){form.scan=form.batch.docs[+d.i];form.fromBatch=true;form.page='scanned';renderSheet()},
  batchApply:function(){
    var g=G(),docs=form.batch.docs.filter(function(x){return x.on});
    if(!docs.length){toast('Wähle mindestens einen Beleg aus');return}
    var recs=[],now=Date.now();
    for(var i=0;i<docs.length;i++){
      var b=scanBuild(g,docs[i]);
      if(!b){toast('Bei '+(docs[i].desc||('Beleg '+(i+1)))+' fehlt der Betrag');return}
      recs.push({id:'e'+uid(),type:'expense',desc:b.desc,amount:b.amount,payer:b.payer,splits:b.splits,mode:b.mode,raw:b.raw,date:b.date,ts:now+i,mts:now+i});
    }
    putMany(g,recs);
    sheet=null;form=null;render();
    toast(recs.length+(recs.length===1?' Ausgabe':' Ausgaben')+' angelegt');
  },
  openSplit:function(){form.page='split';renderSheet()},
  splitBack:function(){form.page=null;renderSheet()},
  moreSplit:function(){form.page='more';renderSheet()},
  splitPick:function(d){
    var g=G(),sel={};
    g.members.forEach(function(m){if(d.w==='1'?m.id!==d.p:true)sel[m.id]=true});
    form.payer=d.p;form.sel=sel;form.mode='equal';form.raw={};form.page=null;renderSheet();
  },
  mode:function(d){form.mode=d.m;renderSheet()},
  saveForm:function(){
    var g=G(),f=form,total=parseAmt(f.amount),rec;
    if(!g||!f||total<=0)return;
    if(f.type==='payment'){
      if(f.payer===f.to)return;
      var sp={};sp[f.to]=total;
      rec={type:'payment',desc:'Zahlung',amount:total,payer:f.payer,splits:sp,date:f.date||today()};
    }else{
      var c=calcSplit(g,f);if(!c.ok||!c.splits||!f.desc.trim())return;
      var raw={};for(var k in c.splits){if(f.raw[k]!==undefined)raw[k]=f.raw[k]}
      rec={type:'expense',desc:f.desc.trim(),amount:total,payer:f.payer,splits:c.splits,mode:f.mode,raw:raw,date:f.date||today()};
    }
    rec.id=f.id||('e'+uid());
    rec.ts=f.ts||Date.now();
    rec.mts=Date.now();
    putExpense(g,rec);
    sheet=null;form=null;render();toast('Gespeichert');
  },
  delExpense:function(){
    if(!confirmDel){confirmDel=true;renderSheet();return}
    removeExpense(G(),form.id);
    sheet=null;form=null;confirmDel=false;render();toast('Gelöscht');
  },
  members:function(){sheet='members';confirmDel=false;render()},
  addMember:function(){
    var n=$('#newm').value.trim(),g=G();if(!n)return;
    if(g.members.some(function(m){return m.name.toLowerCase()===n.toLowerCase()})){toast('Den Namen gibt es schon');return}
    g.members=g.members.concat([{id:'m'+uid(),name:n}]);persistGroup(g);render();
  },
  delMember:function(d){var g=G();g.members=g.members.filter(function(m){return m.id!==d.id});persistGroup(g);render()},
  saveMembers:function(){
    var g=G(),n=$('#rename').value.trim();
    if(n&&n!==g.name){g.name=n;persistGroup(g)}
    sheet=null;render();
  },
  delGroup:function(){
    if(!confirmDel){confirmDel=true;renderSheet();return}
    var g=G();removeGroup(g);
    ui={view:'home',gid:null,tab:'ausgaben',showSettled:false};sheet=null;confirmDel=false;render();toast('Gruppe gelöscht');
  }
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var fn=A[t.dataset.a];if(fn)fn(t.dataset,t);
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='scanfile'&&t.files&&t.files.length&&form){
    var fl=Array.prototype.slice.call(t.files,0,8);
    if(t.files.length>8)toast('Es werden die ersten 8 Fotos gelesen');
    runScanFiles(fl);
    return;
  }
  if(form&&form.batch&&form.page==='batch'&&t.dataset&&t.dataset.bk==='on'){form.batch.docs[+t.dataset.bi].on=t.checked;updateBatch();return}
  if(t.dataset&&t.dataset.t&&form){form.sel[t.dataset.t]=t.checked;renderSheet()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.q!==undefined){q.text=t.value;var el=$('#sres')||$('#glist');if(el)el.innerHTML=(ui.view==='search')?searchResults():expenseList(G());return}
  if(form&&form.batch&&form.page==='batch'&&t.dataset&&t.dataset.bi!==undefined){
    var bd=form.batch.docs[+t.dataset.bi],bk=t.dataset.bk;
    if(bk==='on')bd.on=t.checked;else{bd[bk]=t.value;if(bk==='total')bd.totalTouched=true}
    updateBatch();return;
  }
  if(form&&form.scan&&t.dataset){
    if(t.dataset.sf){form.scan[t.dataset.sf]=t.value;if(t.dataset.sf==='total')form.scan.totalTouched=true;updateScan();return}
    if(t.dataset.si!==undefined){form.scan.items[+t.dataset.si][t.dataset.sk]=t.value;syncTotal();updateScan();return}
  }
  if(!form||!t.dataset)return;
  if(t.dataset.f){form[t.dataset.f]=t.value;updateHint()}
  else if(t.dataset.r){form.raw[t.dataset.r]=t.value;updateHint()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet&&sheet!=='who')A.close()});
try{if(window.self!==window.top)document.documentElement.classList.add('emb')}catch(e){document.documentElement.classList.add('emb')}
loadPrefsLocal();
render();
initStorage();
})();
</script>
</body>
